[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
extend_skip = [".claude"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["^venv/", "^htmlcov/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
